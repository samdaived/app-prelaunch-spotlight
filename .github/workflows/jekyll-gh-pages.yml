name: Deploy to GitHub Pages

on:
  push:
    branches: ["prod"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20" # Node 20 or 22 works great

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy 404 fallback for SPA routing
        run: |
          if [ -d "dist/client" ]; then
            cp dist/client/index.html dist/client/404.html
          else
            cp dist/index.html dist/404.html
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Note: TanStack Start or standard Vite puts output in 'dist' or 'dist/client'. 
          # Adjust if your build outputs to a client subfolder.
          path: "./dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
